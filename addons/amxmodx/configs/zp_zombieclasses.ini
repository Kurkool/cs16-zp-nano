; -------------------------------------
; Zombie Plague 4.3 Zombie Classes File
; -------------------------------------
; Any changes you make here will be
; automatically loaded at map start

; This file will be automatically updated with new
; editable entries as you install new zombie classes.
; CSCF claw models, 2026-08-12. Each class's hands now match its body where
; the pack ships a matching pair. Sources, from the CSCF Yasou 3.0 pack under
; cstrike/SUIC_MODELS/NEAR/, copied into models/zombie_plague/:
;     PV-NANO_GHOST.mdl -> v_claw_nano_ghost.mdl   (8 sequences)
;     PV-INK.mdl        -> v_claw_ink.mdl          (9 sequences)
;     PV-NURSE.mdl      -> v_claw_nurse.mdl        (9 sequences)
; All three are IDST version 10, which is the only version GoldSrc loads - the
; CrossFire packs these came from usually ship v11, which precaches fine and
; then renders nothing, so check that before adding a fourth.
;
; They carry fewer animation sequences than ZP's stock v_knife_zombie.mdl (11),
; and CS plays knife animations by index, so a mismatch would show as a wrong
; or missing animation on draw, idle, slash or stab. Verified in game on the
; 8-sequence model with no problem; the 9-sequence ones are a smaller gap.
;
; To revert everything: restore zp_zombieclasses.ini.bak-clawmodel.
;
; BODY MODELS: only version 10 loads. GoldSrc rejects nothing louder - a v11
; model precaches without complaint and then renders as nothing at all, so the
; player is invisible while their health bar still floats there. Check byte 4
; of the .mdl before adding one. Flipping that byte does NOT work: the CSCF
; Yasou pack's v11 files are encrypted past the header, and stamping them 10
; yields garbage in every field (tested 2026-08-12).
;
; HULK_* and ASSASSIN_* came from Mutant--Dread,assasin,hulk.rar, ported to
; GoldSrc by Black_ranjau (Milkshape + Jed's) - 111 sequences, the same rig as
; GHOST_NORMAL, which is why the animations line up. The HULK and ASSASSIN
; models in the CSCF Yasou pack are the unported v11 originals and are
; unusable; that RAR is where working versions of both came from. Worth
; remembering when a body seems missing: check for a ported release before
; concluding it cannot be had.
; Big uses HULK_NORMAL and Raptor uses ASSASSIN_EVOLVE; the other variant of
; each is installed too, so switching is one line. NANOINK_NORMAL was a loose
; nanoink.mdl download rather than part of either pack - v10, 111 sequences,
; one 512 texture, nothing to fix - and is still installed, as are INK_ORIGIN
; and NURSE_ORIGIN, all as fallbacks.
;
; Two naming things this pack will mislead you about, both established by
; comparing textures rather than trusting labels:
;
; NURSE_ORIGIN and NURSE_EVOLVE are BYTE-IDENTICAL - same SHA256. Switching
; between them changes nothing on screen. NURSE_NORMAL is a genuinely
; different file.
;
; "Psyco" and "Nurse" are the same character with a different head. Every tier
; of both shares NURSE_MASTER_BODY.bmp; only the face and hair textures differ,
; and only at the host and master tiers. nanoPsyco_normal carries the nurse
; face, hair AND body - no psycho texture at all. Poison therefore wears
; PSYCHO_HOST, whose face and hair are PSYCHO_NANO_Host, because the INKUP claw
; it holds is textured PV-PSYCHO_NANO_Host_ARM/_HAND - the only exact
; head-to-hands match available.
;
; Do NOT trust the internal name string inside a CSCF Yasou .mdl - it is stale
; metadata from whatever the author last saved over, not an identifier.
; PV-HULKUP, PV-HULK and PV-NURSE all report themselves as "PV-NURSEUP.mdl",
; and PV-INKUP reports "PV-NANOHOOK_DEVIL.mdl". They are genuinely different
; files - every SHA differs and the sizes range from 1.7 to 3.4 MB - so this is
; sloppy authoring, not duplicated content. Only looking at it in game tells you
; which model you actually have.
;
; CLAW MODELS: a second limit, and it is the one that actually bit. GoldSrc's
; GL_LoadTexture refuses any studio texture larger than 512x512 - the error is
; "GL_LoadTexture: too big" at map load. Version 10 is not enough on its own;
; check every texture's dimensions too.
;
; Scanning all of the pack's PV-*.mdl claw models on 2026-08-12 left only NINE
; usable (v10 AND every texture <= 512): ASSASSINKNIFE, CRAZYKNIFE, DualKukri,
; HASSASSINKNIFE, HCORPSENANO, HCRAZYKNIFE, HPSYCHOKNIFE, INK, NANO_GHOST.
; Of those, only three are bare hands rather than a weapon - NANO_GHOST, INK
; and HCORPSENANO - and all three are now in use.
;
; v_claw_hulkup.mdl and v_claw_nurse.mdl were 1024 and are here anyway, because
; they were downscaled locally rather than dropped. The tool is
; C:\Users\USER\mdl_downscale.ps1. It is not just an image resize: MDL stores
; UV coordinates in absolute texels, so halving a texture without halving every
; S/T on the meshes that use it makes the skin wrap instead of failing. The
; script does the pixels, the UVs and the offsets together, keeps the original
; palette (subsampling reuses existing indices, so no requantisation), and only
; touches meshes whose skinref resolves to a texture it is actually shrinking -
; NURSE needed that, since two of its three textures were already 512.
; Verified after conversion: trivert counts unchanged, header length matches
; file size, and the UV-to-texture ratio is identical to the original, so the
; mapping is the same and only the resolution dropped.
;
; A THIRD trap, and the nastiest because nothing errors: some of these claw
; models hide their hands behind a submodel index. PV-ASSASSIN's first bodypart
; held two submodels - "blank" with zero meshes at index 0, and the real arm at
; index 1 - while the hook sat in a second bodypart with only one submodel. The
; engine picks a submodel as (body / base) % nummodels, so at body 0 you get the
; empty one: a scythe floating in mid-air with no arms attached, and no warning
; anywhere. PV-HULKUP had the same shape with three submodels.
;
; Relying on body being set correctly is a bad bet on this server specifically -
; the floating-damage addon packs a four-digit number into pev_body, which is
; why delta.lst has its body fields widened. So the models were edited instead:
; bodypart 0's nummodels dropped to 1 and its modelindex advanced past the blank
; entry, then every bodypart's base recomputed. No data moved; the blank record
; is simply no longer referenced.
;
; Check for this with any new claw: a bodypart whose first submodel has zero
; meshes means the hands will be invisible.
;
; That mechanism turned out to be useful rather than only a hazard. This pack
; grades its zombies NORMAL -> HOST -> MASTER, and for the assassin the MASTER
; arm exists nowhere except as submodel h2 inside PV-ASSASSINUP. Raptor wears
; ASSASSIN_EVOLVE, which is the MASTER-tier body, so v_claw_assassin.mdl is
; that model reduced to h2 - keeping the tier matched instead of settling for
; the NORMAL arm that PV-ASSASSINKNIFE would have given. The hook bodypart
; comes along with it; dropping numbodyparts from 2 to 1 would leave bare
; MASTER hands if the hook is ever unwanted.
;
; v_claw_corpsenano.mdl is installed and currently unused - the fallback if a
; downscaled model turns out wrong.
