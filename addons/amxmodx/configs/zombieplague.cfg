// Both admin model settings are OFF deliberately. When they are on, ZP gives
// anyone holding the ADMIN MODELS flag (= "d", zombieplague.ini:33) the models
// at zombieplague.ini:41-42 instead of their normal ones - and that branch
// short-circuits the zombie CLASS model entirely (zombie_plague40.sma:5617).
// Since the only admin here is the human player and the bots have no flags,
// leaving these on meant the player always got ADMIN ZOMBIE = zombie_source,
// ZP's stock model, while every bot correctly showed the installed CSCF class
// models. Same story on the human side with ADMIN HUMAN = vip.
