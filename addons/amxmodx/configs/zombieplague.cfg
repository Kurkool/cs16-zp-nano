// Zombies
// -------
zp_zombie_first_hp 2.0 // First zombie HP multiplier (2.0 = double health)
// 2026-08-17: armor off. It is not armor in any depleting sense - zombie_plague40.sma:2075
// is a flat `damage *= this` inside Ham_TakeDamage, applied to every bullet for the
// whole round, with no pool and nothing that runs out. CSCF has no equivalent field
// at all: its 20 classes separate themselves by health, gravity and a health-recovery
// mechanic (recoverWait/Time/Per 3.0/3.0/15.0 in SUIC_CONFIG/SYSTEM/SUIC_NANO.RC),
// never by a damage multiplier. This is the cheap half of trying that shape - take
// the multiplier out and see how it feels before writing regen that ZP does not have.
//
// Everything downstream shifts by 1/0.75 = +33%: every weapon multiplier, every stab,
// and the ammo pack payout, since the damage counter at :2083 accumulates AFTER this.
// Note Nemesis never got the cut, so Nemesis rounds are unchanged.
// was zp_zombie_armor 0.75
zp_zombie_armor 1.0 // Armor multiplier (1.0 = zombies take full damage)
zp_zombie_hitzones 0 // Allowed hitzones bitsum (look into fun.inc for body part bits) [0-disabled]
zp_zombie_infect_health 100 // How much health a zombie regains with every infection
zp_zombie_fov 110 // Field of view [0-dont change]
zp_zombie_silent 1 // Enable silent footsteps
// 0 so that NO zombie is exempt: every one of them takes the engine's pain shock
// and slows for a moment on each hit, including the last zombie alive, which the
// old value of 2 was shielding. This is the mechanic that makes shooting feel
// like it holds them back, now that knockback is off.
//
// Note pain shock is per-hit and brief. Under sustained fire the dips run
// together and read as a steady slow; a single shot is a single stumble. A truly
// sustained slow would need a plugin - nothing in ZP does that except
// zp_fire_slowdown, which only applies while a zombie is burning.
// was zp_zombie_painfree 2
zp_zombie_painfree 0 // Zombies are pain shock free [0-disabled // 1-enabled // 2-only last zombie // 3-only first zombie]
zp_zombie_bleeding 1 // Zombies leave footprints/bloodstains on the floor
