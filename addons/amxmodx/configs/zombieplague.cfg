// --- damage combo (added by setup) ---
// Replaces zp_human_damage_reward above; see the note there before changing
// either. The progress block builds up at x 0.82 from y 0.42 in steps of a
// tenth of the threshold, folding each five lines into one as the sixth step
// lands, so it never grows past five lines; the payout announcement is centred
// at y 0.70. Changing this threshold rescales the block automatically - at 1000
// it counts in 100s and folds into +500 at 600.
// Both use channel-based HUD text on a channel of their own. The large DHUD
// font was tried for the announcement and dropped: its message stack is shared
// server-wide and cannot be cleared, so a payout landing during sustained fire
// found no free slot and was discarded silently - the reward sound played and
// the text never appeared. See the plugin header before reaching for it again.
zp_combo_damage 1000   // damage a human must deal to zombies per ammo pack; 0 turns the damage half off
zp_combo_sound 1       // play nano3/nano3_wraithpoint_up.wav on a payout
zp_combo_hud 1         // show the progress block
// Keep this at 0 while playing. log_amx writes the log file synchronously on the
// game thread, so a few payouts a second in a heavy fight cost frames and hitch
// visibly - measured here, and it went away the moment this hit 0. Turn it on
// only to investigate something. zp_rules_debug below writes on every death and
// deserves the same suspicion.
zp_combo_debug 0       // log the payout trace ([COMBO] lines) to the amxx log
// The chat line is the copy that cannot be lost. Every HUD arrangement of the
// payout message went missing part of the time - the client has only four HUD
// channels, they are shared server-wide, nothing can reserve one, and ZP alone
// rewrites one every second and broadcasts a five-second notice to everybody on
// every infection. Chat is outside that system entirely and scrolls back. Turn
// it off only if you are happy to miss payouts.
zp_combo_chat 1        // also announce each payout in chat, with the new pack total
// Packs for killing a zombie, on top of the damage above. This rule does NOT
// exist in ZP - ZP pays the zombie side for kills and the human side only for
// damage. Because four of the five classes have more health than
// zp_combo_damage, killing one already crossed the damage line by itself, so
// this mostly changes two cases: Raptor at 900 health, which could pay nothing,
// and stealing a kill someone else did the damage for. Killing a Classic now
// pays 2 packs in total, a Big 3. Set to 0 to go back to damage only.
zp_combo_kill_packs 1  // ammo packs a human gets per zombie killed; 0 turns the kill half off

// mp_round_infinite is driven by zp_round_rules while it is loaded - leave it
// alone during normal play. The value is computed fresh every time CS asks -
// zp_round_rules hooks CheckWinConditions through ReAPI - so reading this
// cvar between rounds tells you nothing useful about the rule.
// "f" blocks CS's team-extermination round end and is held while any
// zombie can still return; "0" releases it once none can, or once no
// human is left alive. zp_round_rules resets this to "0" when it
// unloads, but if it is ever disabled or crashes without unloading
// cleanly and rounds stop ending, set mp_round_infinite 0 yourself -
// that is the safe/off value. game.cfg:50 already sets mp_round_infinite
// "0" on every map load too, so a gate stuck at "f" cannot outlive a map
// change even in that crash case - the manual reset above only matters
// for a wedge within the CURRENT map.

// --- M4A1-S Angelic Beast (added by setup) ---
zp_angelic_cost 85            // menu price, read at map start
zp_angelic_dmg 2.5            // bullet damage multiplier
zp_angelic_clip 52            // rounds per clip
zp_angelic_ammo 156           // reserve ammo
zp_angelic_stab_dmg 1000.0    // flat stab damage. Used to land as 750 through the 0.75 armor cut; with zp_zombie_armor 1.0 the full 1000 lands
zp_angelic_stab_range 137.8   // stab reach in units; 39.37 units = 1 metre, so this is 3.5m
// was hardcoded 0.85, which came from CrossFire's BORN Beast (intervalTime
// 0.070|0.85) rather than the Prism Beast this gun is matched to. Measured:
// v_angelic.mdl sequence 6 is 67 frames at 100 fps = 0.670s, so 0.85 left both
// mouse buttons dead for 180ms after the hands were already back on the gun.
// The Prism Beast's own melee cooldown is 0.55 but that is SHORTER than this
// animation, so the animation length is the floor here. Re-time the model and
// this has to follow.
zp_angelic_stab_delay 0.67    // seconds both buttons stay locked after a stab
// Bullet cone multiplier, via a ReGameDLL FireBullets3 hook - a real percentage on
// the cone the engine fires with. This is the CrossFire stat that could never be
// ported: the Prism Beast uses moderator 0.5 + resetTime 0.3, an accuracy-recovery
// model CS has no equivalent for, and the only lever CS offers from outside is
// pinning m_flAccuracy, which has never been shown to change anything.
// Needs the reapi module; the plugin logs if the hook fails to attach.
// PROVEN WORKING 2026-08-17, by measuring the impact points rather than looking at
// the wall. Standing still, 12 rounds each:
//
//     scale 0.0 -> group 2.46 units      scale 1.0 -> group 5.36 units
//
// The 2.46 left at scale 0 is not cone, it is the camera: punchangle still moves the
// aim between rounds, so the bullets go where the crosshair points and the crosshair
// has moved. So the cone itself is worth about 2.9 units of that 5.36, and 0.02
// (the standing cone the trace logged) times a wall around 300 units away predicts
// ~6 - the measurement and the arithmetic agree.
//
// Which also explains why eyeballing this failed for four rounds: at 1.0 against 0.5
// the difference is 5.4 units against 4 on a wall. Nobody was ever going to see that.
// The cone matters when MOVING - the trace logged 0.105 walking and 0.17 airborne,
// five to eight times the standing value.
zp_angelic_spread_scale 0.5   // 1.0 = the M4A1's own cone
// Diagnostic for the above, because it has not been shown to work yet. Writes one
// line per burst to the amxx log naming the cone the engine handed us and the one we
// asked for. It prints even when it recorded nothing, since "the hook never fired" is
// the answer worth having. Off while playing - it is a disk write per burst.
//
// Off again - the question it was built for is answered. Keep in mind if it is ever
// switched back on: set it HERE, not in the console. This file is exec'd on every map
// start, so a console value set before a mapchange is wiped by the reload, and a new
// .amxx needs a mapchange to load. Those two facts together cost three test rounds.
//
// It reports, per burst: the cone the engine handed us, the cone we asked for, and
// the size of the resulting group in units measured from the real impact points. The
// last of those is the only part that ever settled anything.
zp_angelic_debug_spread 0
//
// TEMPORARY argument probe. The trace above proved the hook fires, pEntity is a
// player index, the guard passes and SetHookChainArg runs on every bullet - and the
// group still does not change. So either arg 4 is not vecSpread, or the cone is
// already spent by the time a pre-hook sees it.
//
// argidx 0 = off (normal spread behaviour). Anything else overwrites THAT argument
// with argval instead, so an unmistakable parameter can be used as the probe rather
// than a bullet group that has to be judged by eye. Set argtype 1 for the integer
// parameters - iPenetration, iBulletType, iDamage - or a float will corrupt them.
//
// ANSWERED 2026-08-17: argidx 8 with argval 1 dropped damage to nothing, so arg 8 is
// iDamage, the numbering DOES count pEntity, and arg 4 is vecSpread after all - the
// index was right from the start. Probe off; it stays in the file because the same
// question will come up for any other hook chain.
zp_angelic_debug_argidx 0
zp_angelic_debug_argval 0
zp_angelic_debug_argtype 0
zp_angelic_recoil_mode 1      // 0 = old punch scaling below, 1 = CrossFire Prism Beast KickBack (caps 0.8 up / 0.5 lateral)
zp_angelic_recoil 0.15        // only used when zp_angelic_recoil_mode 0
zp_angelic_interval 0.070     // seconds between shots; CF Prism Beast value, ~857rpm vs the stock M4A1's 0.0875 (~686)
zp_angelic_deploy_time 0.81   // CF Prism Beast draw time
zp_angelic_speed 1.30         // speed multiplier while awakened
zp_angelic_threshold 0.30     // clip fraction that triggers awakening
zp_angelic_reload_time 2.1    // model reload sequences were re-timed to 76.2fps to match this
// Reload sound beats, as fractions of the reload time above. Unlike the Iron
// Beast's, these were not tuned by ear - v_angelic.mdl carries the animator's
// own studio events, so the frame each sound belongs on is written into the
// model and can just be read out:
//
//     frac = event frame / 160 frames   ->   bang time = frac * reload time
//
// No transient correction is applied, unlike zp_ironbeast_frac_magin below:
// these four files were measured and every one has its onset inside its first
// 0.02s and its peak by 0.05s, so the file starts where the bang is.
//
// tools/check_reload_timing.ps1 verifies these against the model. Run it after
// changing any of them, or after touching the model or the reload time.
//
// was: played the instant the reload began, 262ms before the hands get there
zp_angelic_frac_clipout 0.125   // frame 20 - magazine leaves the gun. 0 restores the old instant behaviour
zp_angelic_frac_clipin 0.375    // frame 60 - new magazine seated. was 0.39, 31ms late
// The bolt is the one beat the two reload animations disagree on, which is why
// there are two of these. seq 4 racks the charging handle on frame 116, seq 11
// thumbs the bolt release on frame 106 - 131ms apart. Both used to run off a
// single 0.71, which was within 31ms on seq 4 and 100ms late on seq 11.
// docs/2026-08-16-handoff.md blamed the wrong one of the two; the model settled it.
zp_angelic_frac_bolt 0.725      // seq 4, charging handle pulled. was 0.71 for both
zp_angelic_frac_bolt_alt 0.6625 // seq 11, bolt release thumbed. was 0.71, the audible one
zp_angelic_awaken_msg 1       // centre-screen line when the gun awakens
zp_angelic_decals 1           // bullet holes, drawn by the plugin since the fire event is blocked
// Where those holes go. The plugin used to trace one line straight down v_angle
// and stamp a single hole there, which marks where you AIMED, not where the round
// went - the gun looked pinpoint because the holes never showed its spread. That
// also hid the fact that pinning m_flAccuracy may never have done anything.
// 1 draws at the real impact points instead. Expect the gun to look less accurate
// than it used to; that is the truth becoming visible, not a regression.
zp_angelic_decal_real 1       // 0 restores the old single hole on the crosshair
zp_angelic_debug 0            // stab tracing to the amxx log; only fires on right click, safe to switch on live

// --- M4A1-S Iron Beast (added by setup) ---
// Every number here is the Angelic's, by request. The CrossFire Prism Beast
// values in docs/M4A1-S_stats.md were the starting point and were then all
// overridden, so that document is not the source for this block - the lines
// above are. The two guns differ in model, sounds, and the Iron Beast having no
// awakened state at all, which is why zp_angelic_speed, _threshold and
// _awaken_msg have no counterpart down here.
zp_ironbeast_cost 85           // menu price, read at map start
zp_ironbeast_dmg 2.5           // bullet damage multiplier
zp_ironbeast_clip 52           // rounds per clip
zp_ironbeast_ammo 156          // reserve ammo
zp_ironbeast_stab_dmg 1000.0   // flat stab damage. Used to land as 750 through the 0.75 armor cut; with zp_zombie_armor 1.0 the full 1000 lands
zp_ironbeast_stab_range 137.8  // 3.5m. The Prism Beast's own melee range is 65 units (1.65m) - this is deliberately more than double it
// was hardcoded 0.85, from CrossFire's BORN Beast rather than the Prism Beast.
// Measured: v_ironbeast.mdl sequence 6 is 267 frames at 500 fps = 0.534s, so 0.85
// left both mouse buttons dead for 316ms after the animation had finished. 0.55 is
// the Prism Beast's own melee cooldown AND fits the animation with 16ms to spare.
zp_ironbeast_stab_delay 0.55   // seconds both buttons stay locked after a stab
// Bullet cone multiplier via the same ReGameDLL FireBullets3 hook the Angelic uses;
// see the note in its block above for why m_flAccuracy was not enough.
zp_ironbeast_spread_scale 0.5  // 1.0 = the M4A1's own cone
zp_ironbeast_recoil_mode 1     // 0 = punch scaling below, 1 = CrossFire KickBack table (same numbers as the Angelic)
zp_ironbeast_recoil 0.15       // only used when zp_ironbeast_recoil_mode 0
zp_ironbeast_interval 0.070    // seconds between shots, ~857rpm
zp_ironbeast_deploy_time 0.81  // draw time
// 2.1, matching the Angelic, and the MODEL was changed to suit rather than the
// animation being cut off. v_ironbeast.mdl sequence 1 was 300 frames at 122 fps
// = 2.46s, which is the stock AK47's reload; its fps is now 142.86 so the same
// 300 frames finish in 2.10s. Original kept as v_ironbeast.mdl.orig - the same
// approach the Angelic uses, which was re-timed from 52 to 76.2 fps.
//
// If this number changes, the model has to be re-timed again: fps = 300 / time.
// Leaving them out of step is what makes the hands snap back to idle mid-motion.
// The frac lines below do NOT need recalculating - they are fractions of this
// value and the animation now runs for exactly this value, so a given fraction
// points at the same animation frame either way.
// was zp_ironbeast_reload_time 2.46 (with the model at 122 fps)
zp_ironbeast_reload_time 2.1   // model re-timed to 142.86 fps to match
// Reload sound beats, as fractions of the reload time above. Cvars rather than
// constants because getting them right means watching the animation and moving
// them a few hundredths at a time. Nothing plays at t=0 - the draw sound covers
// the gun coming up, and the pack has no magazine-OUT sound.
// The magazine sound is an IMPACT AT ITS START, not a sound with the hit in the
// middle: peak amplitude is in the first 0.08s and the remaining second is the
// glass tail decaying to silence by 1.12s. So this fraction is not 'when the
// magazine sound plays', it is 'when the bang lands', and the formula is
//
//     bang time = frac * zp_ironbeast_reload_time + 0.05
//
// 0.10 put the bang at 0.30s, which is far too early - the hands have not got
// the old magazine out yet. 0.40 puts it at 1.03s. Nudge from there; the tail
// is quiet enough that overrunning the end of the reload does not matter.
// was zp_ironbeast_frac_magin 0.10
zp_ironbeast_frac_magin 0.40   // bang lands at 1.03s
zp_ironbeast_frac_bolt 0.71    // bolt release button, just after the magazine is seated
zp_ironbeast_decals 1          // bullet holes, drawn by the plugin since the fire event is blocked
// Same change as zp_angelic_decal_real - this plugin's DrawBulletHole was a
// byte-identical copy of the Angelic's, so it had the same defect: one hole traced
// straight down v_angle, marking where you aimed rather than where the round went.
zp_ironbeast_decal_real 1      // 0 restores the old single hole on the crosshair
// --- AT15 HW (added by setup) -----------------------------------------------
// Hijacks weapon_galil, not the M4A1 the others use. The plugin is an AKS74U one
// with the AT15 models dropped onto it, so every cvar below still says aks74u -
// only the cost cvar was added and it is the one named for the actual gun.
//
// The reload time lives in the plugin as a #define, not here: it was set to 1.7
// to match v_at15hw.mdl sequence 1, which is 97 frames at 57 fps = 1.702s. The
// pack shipped 2.4, which locked the player out for 0.7s after the animation had
// already finished. Change one and the other has to follow.
zp_at15hw_cost 43              // menu price, read at map start
// was zp_aks74u_dmg 1.0 (the pack default, the galil's own damage untouched),
// then 1.15, then 1.7, then 1.9
// Bullet damage multiplier, applied AFTER ZP's own hook: ZP loads first, so its
// Ham_TakeDamage runs first and zp_zombie_armor is already baked in before this
// multiplies. The chain per body shot is
//
//     galil base -> x zp_zombie_armor -> x zp_aks74u_dmg
//
// With the armor at 1.0 that middle step is now a no-op, so this multiplier lands
// whole - the same number is worth 33% more than it was under 0.75. To land a
// chosen N per body shot, set this to N / (galil base x zp_zombie_armor).
// ~76% of the Angelic's damage per bullet - but this gun also fires at the
// galil's own rate rather than the 0.070 the Angelic is pinned to, so sustained
// output lands nearer 60% of it. Per-shot and per-second are not the same
// comparison here.
zp_aks74u_dmg 2.1
zp_aks74u_clip 42              // rounds per clip. Overrides the galil's native 35 through pdata, the same way the Angelic runs 52 on a 30-round M4A1
zp_aks74u_ammo 180             // reserve ammo
zp_aks74u_spd 1.0              // rate of fire multiplier applied to the galil's cycle time
//
// Recoil. Mode 1 runs the CrossFire KickBack table compiled into the plugin -
// the same [M4A1_S_PRISMBEAST] numbers the Angelic and Iron Beast use, because
// this build of CSCF ships AT15 icons but no [AT15_*] stat section to copy from.
// What that table buys is a low ceiling on the accumulated kick rather than a
// smaller first shot, which is what makes a gun sit still through a burst.
//
// kick_scale multiplies every magnitude in the table: 0.55 puts the standing cap
// at 0.44 up / 0.275 lateral against the Angelic's 0.8 / 0.5, and stock CS's
// roughly 3.5 / 2.5. Nudge it live, no recompile. It deliberately does not scale
// the direction-change column, which is a probability rather than a magnitude.
// was zp_aks74u_kick_scale 0.60 (the first pass, 40% less)
zp_aks74u_recoil_mode 1        // 0 = the pack's plain punchangle scaling below instead
zp_aks74u_kick_scale 0.55      // 1.0 = the Angelic's recoil exactly; 0.55 = 45% less
zp_aks74u_recoil 1.0           // only used when zp_aks74u_recoil_mode 0
//
// Bullet grouping, which is a DIFFERENT mechanism from the recoil above and the
// reason a gun can sit still on screen and still spray: punchangle moves the camera,
// the cone moves the bullets.
//
// zp_aks74u_accuracy_cap used to sit here, clamping m_flAccuracy. It is gone, along
// with the clamp itself and the trace built to test it, because it never did
// anything - measured 2026-08-17, the cone ReGameDLL hands FireBullets3 still climbs
// across a burst with the value forced to 0 on every shot. Removed from all three
// guns rather than left as a knob that reads like it works.
//
// This hooks ReGameDLL's FireBullets3 and multiplies vecSpread, the cone the engine
// is about to fire with, so it is a straight percentage that does not care whether
// m_flAccuracy is reachable. Measured working on the Angelic: 2.46 units of group at
// scale 0 against 5.36 at 1.0, and the 2.46 that remains is camera kick, not cone.
// Needs the reapi module; the plugin logs if the hook fails to attach.
zp_aks74u_spread_scale 0.5     // 1.0 = the galil's own cone
zp_ironbeast_debug 0           // purchase and stab tracing; log_amx writes cost frames, leave off while playing
