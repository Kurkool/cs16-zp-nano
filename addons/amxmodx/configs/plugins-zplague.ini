; Extra item: M4A1-S Angelic Beast (written for this server)
; load order no longer constrained - zp_round_rules stopped reading the
; damage value once it stopped cancelling the last zombie's death
; no "debug" on this one: it disables the JIT for the plugin, and the two
; per-frame hooks in it (FM_UpdateClientData, Ham_Item_PostFrame) make that
; cost show up as stutter while firing
zp_extra_angelic_beast.amxx

; Second M4A1 extra item, mechanically a copy of the Angelic with a
; different model and no awakened state. Keys off pev_impulse like the
; rest, so it cannot collide with the Angelic or the Frost on the same
; weapon. Same warning as above: no "debug" flag on this line.
zp_extra_ironbeast.amxx

zp_round_rules.amxx   ; hard-depends on the reapi module (see modules.ini) for its round-end gate - no #if defined guard, so it fails to load without it; see docs/2026-08-11-zp-gate-restructure-design.md

; Voice countdown over the last 10s of zp_delay
zp_ghost_countdown.amxx

; Ammo packs for damage dealt to zombies and for killing them, with the
; progress on screen. Requires zp_human_damage_reward 0 in zombieplague.cfg -
; ZP has the damage reward built in and leaving both on pays out twice. The
; kill reward has no ZP equivalent for humans; see the plugin header.
zp_damage_combo.amxx

; Extra item: No Recoil (single round)
zp_extra_no_recoil.amxx

; Floating damage numbers over whoever you hit (github YoshiokaHaruki).
; Not a ZP plugin - it lives here only because this is the list this server
; actually loads its custom plugins from. Compiled locally with the reapi
; include commented out, since there was no reapi module installed at the
; time. There is one now - see modules.ini - but this plugin is still running
; the build that has it compiled out, deliberately. Rebuilding it with the
; reapi path enabled is a separate change with its own verification. Needs
; the three body fields in cstrike/delta.lst widened from 8 to 16 bits, which
; is already done; delta.lst.bak is the stock file if that ever has to go
; back.
addon_floating_damage.amxx


