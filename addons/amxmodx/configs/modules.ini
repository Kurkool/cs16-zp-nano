; reapi 5.29.0.358 - https://github.com/s1lentq/reapi/releases
; zp_round_rules.amxx hard-depends on this module (no #if defined guard -
; without it, the plugin fails to load rather than running gateless). This
; repo tracks the ten headers that release shipped under scripting/include:
; the nine reapi*.inc headers plus cssdk_const.inc, which reapi.inc itself
; #includes - pinned to the version above, but not the compiled
; reapi_amxx.dll itself - binaries under addons/ are git-ignored. A fresh
; restore of this server needs that exact release re-downloaded and dropped
; into addons/amxmodx/modules/: a mismatched version could still compile
; and load with no version assertion, and could silently shift hook-chain
; ordinals.
reapi


